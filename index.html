var MEDALS=[["#ffdc7a","#c9971f"],["#e6eef7","#93a3b5"],["#eeae6f","#a4642c"]];

function renderPodium(body){
  var m=VIEW();
  var ranked=m.players.slice().sort(function(a,b){ return b.wins-a.wins; });
  var contested=m.winners.filter(function(w){ return w.length; }).length;
  var top=ranked.slice(0,3), n=top.length;
  var slotRanks = n>=3 ? [1,0,2] : (n===2 ? [1,0] : [0]);
  var W=420, H=300, floorY=238, pw=112, gap=8;
  var startX=(W-(n*pw+(n-1)*gap))/2;
  var hByRank=[88,68,52];
  var defs='', scene='', beams='', refl='', labels='';

  top.forEach(function(p,r){
    defs+='<linearGradient id="beam'+r+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="'+p.color+'" stop-opacity=".2"/>'+
        '<stop offset="1" stop-color="'+p.color+'" stop-opacity="0"/></linearGradient>'+
      '<linearGradient id="face'+r+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="#1d1e23"/><stop offset="1" stop-color="#101114"/></linearGradient>'+
      '<linearGradient id="refl'+r+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="'+p.color+'" stop-opacity=".18"/>'+
        '<stop offset="1" stop-color="'+p.color+'" stop-opacity="0"/></linearGradient>'+
      '<radialGradient id="pool'+r+'" cx="50%" cy="50%" r="50%">'+
        '<stop offset="0" stop-color="'+p.color+'" stop-opacity=".3"/>'+
        '<stop offset="1" stop-color="'+p.color+'" stop-opacity="0"/></radialGradient>';
  });

  slotRanks.forEach(function(r,slot){
    var p=top[r], x=startX+slot*(pw+gap), cx=x+pw/2;
    var h=hByRank[r], ty=floorY-h, d=9;
    beams+='<path d="M'+(cx-16)+' 0 L'+(cx+16)+' 0 L'+(cx+52)+' '+ty+' L'+(cx-52)+' '+ty+'Z" fill="url(#beam'+r+')"/>';
    beams+='<ellipse cx="'+cx+'" cy="'+(ty-4)+'" rx="'+(pw/2+6)+'" ry="9" fill="url(#pool'+r+')"/>';
    refl+='<rect x="'+(x+6)+'" y="'+floorY+'" width="'+(pw-12)+'" height="'+Math.round(h*0.42)+
      '" fill="url(#refl'+r+')"/>';
    scene+='<g>'+
      '<polygon points="'+x+','+ty+' '+(x+pw)+','+ty+' '+(x+pw-d)+','+(ty-d)+' '+(x+d)+','+(ty-d)+'" '+
        'fill="'+p.color+'" opacity=".32"/>'+
      '<rect x="'+x+'" y="'+ty+'" width="'+pw+'" height="'+h+'" rx="3" fill="url(#face'+r+')" '+
        'stroke="'+p.color+'" stroke-opacity=".45"/>'+
      '<rect x="'+x+'" y="'+ty+'" width="'+pw+'" height="3.5" fill="'+p.color+'" opacity=".9"/>'+
      '<circle cx="'+(x+20)+'" cy="'+(ty+21)+'" r="11" fill="'+MEDALS[r][1]+'"/>'+
      '<circle cx="'+(x+20)+'" cy="'+(ty+19.5)+'" r="9.5" fill="'+MEDALS[r][0]+'"/>'+
      '<text x="'+(x+20)+'" y="'+(ty+23.5)+'" text-anchor="middle" fill="#2a1c05" '+
        'font-size="12" font-weight="700" style="font-family:var(--font-display)">'+(r+1)+'</text>'+
      '<text x="'+cx+'" y="'+(ty+h*0.66)+'" text-anchor="middle" fill="'+p.color+'" '+
        'font-size="34" font-weight="700" style="font-family:var(--font-display)">'+p.wins+'</text>'+
      '<text x="'+cx+'" y="'+(ty+h*0.66+13)+'" text-anchor="middle" fill="#7a7f89" '+
        'font-size="9" letter-spacing="1.6" style="font-family:ui-monospace,monospace">WINS</text>'+
      '</g>';
    var sc=0.74, px=cx-30*sc, py=(ty-d+2)-92*sc;
    scene+='<g transform="translate('+px.toFixed(1)+','+py.toFixed(1)+') scale('+sc+')">'+
      '<g class="kit-enter" style="animation-delay:'+(slot*0.09)+'s">'+playerArt(p.color,r)+'</g></g>';
    labels+='<text x="'+cx+'" y="'+(floorY+22)+'" text-anchor="middle" fill="#f5f6f8" '+
      'font-size="15" font-weight="700" letter-spacing="1" '+
      'style="font-family:var(--font-display);text-transform:uppercase">'+esc(p.name)+'</text>'+
      '<text x="'+cx+'" y="'+(floorY+38)+'" text-anchor="middle" fill="#7a7f89" '+
      'font-size="10.5" letter-spacing="1" style="font-family:ui-monospace,monospace">'+
      (contested?Math.round(p.wins/contested*100):0)+'% OF DAYS</text>';
  });

  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Podium of daily wins">'+
    '<defs>'+defs+
      '<linearGradient id="floorline" x1="0" y1="0" x2="1" y2="0">'+
        '<stop offset="0" stop-color="#ffffff" stop-opacity="0"/>'+
        '<stop offset=".5" stop-color="#ffffff" stop-opacity=".5"/>'+
        '<stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>'+
    '</defs>'+beams+refl+
    '<rect x="20" y="'+floorY+'" width="'+(W-40)+'" height="1.4" fill="url(#floorline)"/>'+
    scene+labels+'</svg>';

  var best=Math.max.apply(null,m.players.map(function(p){ return p.longest; }));
  var holders=m.players.filter(function(p){ return p.longest===best && best>0; });
  var chips='<div class="streakbar">';
  var streaking=m.players.filter(function(p){ return p.streak>0; });
  if(streaking.length) streaking.forEach(function(p){
    chips+='<span class="s" style="border-color:'+p.color+'55">\uD83D\uDD25 <b>'+esc(p.name)+
      '</b> on a <b class="num">'+p.streak+'</b>-day streak</span>';
  });
  else chips+='<span class="s">No active streak</span>';
  chips+='<span class="s"><b class="num">'+contested+'</b> matchday'+(contested===1?"":"s")+'</span>';
  chips+='<span class="s"'+(holders.length===1?' style="border-color:'+holders[0].color+'55"':'')+'>'+
    'Longest streak '+(holders.length?'<b>'+holders.map(function(p){return esc(p.name);}).join(" & ")+
    '</b> <b class="num">'+best+'</b> day'+(best===1?"":"s"):'<b>\u2014</b>')+'</span>';
  chips+='</div>';
  body.innerHTML=scopeNote(m)+'<div class="podium-scene">'+svg+'</div>'+chips;
}

    var key=row.getAttribute("data-k");

      if(cfg) cfg.name=e.target.value||key;

/* ============================================================================
   16. LEAGUE FORMAT  —  EDIT LEAGUE_ERAS TO CHANGE THE SQUAD OR RULES
   ----------------------------------------------------------------------------
   A fixture is two players' scores on the same matchday:
     margin >  drawMargin  -> win / loss   (WIN_PTS / LOSS_PTS)
     margin <= drawMargin  -> draw         (DRAW_PTS each)

   The squad and the draw threshold are set per ERA. Each era applies from its
   `from` season onward, so earlier seasons are frozen exactly as they were
   played: changing the squad never rewrites a past season.

   `roster` lists the players by their row label in the spreadsheet, in fixture
   order. A replacement keeps the same position as the player they replace, so
   they inherit that player's fixture slot in the round-robin.
   ========================================================================== */
var LEAGUE_ERAS = [
  { from:1, drawMargin:3000, missed:"void",
    roster:["Ewan Mc","Dan","Paul Mc","Billzo","Cobbola","Slosher"] },
  { from:6, drawMargin:2000, missed:"walkover",
    roster:["Ewan Mc","Dan","Paul Mc","Billzo","Cobbola","Liam"] }     /* Liam replaces Slosher */
];

/* FORFEITS. A missed day can be recorded two ways, with the same result:
     1. Enter the absent player's score as their opponent's minus FORFEIT_GAP
        (3,001). From Season 6, opponent minus 2,001 (one over the new
        threshold) is also recognised.
     2. Leave the cell blank. In an era with missed:"walkover", the player who
        did play takes the win automatically.
   Forfeit entries count in the league exactly as before, but are removed from
   every Dashboard stat, because they are not real scores. A blank on the most
   recent matchday is shown as "awaiting" rather than forfeited, so nobody loses
   for not having played yet today. */
var FORFEIT_GAP = 3001;
var WIN_PTS  = 3;
var DRAW_PTS = 1;
var LOSS_PTS = 0;

/* What happens when a fixture can't be played because someone missed the day.
     "void"     - postponed: no points to either player
     "walkover" - the player who did post a score takes the win            */
var MISSED_FIXTURE = "void";

function eraFor(season){                      /* season is 1-based */
  var e=LEAGUE_ERAS[0];
  LEAGUE_ERAS.forEach(function(x){ if(x.from<=season) e=x; });
  return e;
}

/* Circle-method round robin: rounds of [i,j] index pairs, then the reverse
   fixtures, so everyone meets everyone twice. Odd squads get a bye. */
function roundRobin(n){
  var ids=[],i;
  for(i=0;i<n;i++) ids.push(i);
  if(n%2) ids.push(-1);
  var m=ids.length, fixed=ids[0], rot=ids.slice(1), rounds=[];
  for(var r=0;r<m-1;r++){
    var pairs=[[fixed,rot[0]]];
    for(i=1;i<m/2;i++) pairs.push([rot[i],rot[rot.length-i]]);
    rounds.push(pairs.filter(function(p){ return p[0]>=0&&p[1]>=0; }));
    rot.unshift(rot.pop());
  }
  return rounds.concat(rounds.map(function(rd){
    return rd.map(function(p){ return [p[1],p[0]]; });
  }));
}

/* Matchday date indices: any date where at least one score was posted. */
function matchdayIndices(model){
  var out=[];
  model.dates.forEach(function(d,i){ if(model.winners[i].length) out.push(i); });
  return out;
}

/* Season boundaries, walking forward era by era (eras can differ in size).
   Always includes the season in progress — or, if the last one has just
   finished, the next season as "upcoming" with nothing played yet. */
function seasonPlan(model){
  var mds=matchdayIndices(model), plan=[], start=0, s=1;
  while(true){
    var per=roundRobin(eraFor(s).roster.length).length;
    plan.push({ season:s, start:start, per:per, mds:mds.slice(start,start+per) });
    if(start+per>=mds.length) break;
    start+=per; s++;
  }
  var last=plan[plan.length-1];
  if(last.mds.length===last.per)
    plan.push({ season:s+1, start:start+last.per,
                per:roundRobin(eraFor(s+1).roster.length).length, mds:[] });
  return plan;
}
function seasonCount(model){ return model.players.length<2 ? 0 : seasonPlan(model).length; }

/* Resolve an era roster against the sheet. Matching is case-insensitive. A
   name not found (e.g. a new player with no scores yet) becomes a placeholder
   whose fixtures are postponed, so the season still renders correctly. */
function resolveRoster(model,roster){
  return roster.map(function(name,i){
    var hit=model.players.filter(function(p){
      return p.key.trim().toLowerCase()===String(name).trim().toLowerCase();
    })[0];
    if(hit) return hit;
    var blank=model.dates.map(function(){ return null; });
    return { key:name, name:name, color:KIT_COLORS[(model.players.length+i)%KIT_COLORS.length],
             badge:"\u26BD", scores:blank, missing:true };
  });
}

/* ----------------------------------------------------------------------------
   buildLeague(model, seasonIdx)   seasonIdx is 0-based
   -------------------------------------------------------------------------- */
function buildLeague(model,season){
  var plan=seasonPlan(model)[season]||seasonPlan(model).slice(-1)[0];
  var era=eraFor(plan.season), margin=era.drawMargin;
  var ps=resolveRoster(model,era.roster);
  var fixtures=roundRobin(ps.length), slice=plan.mds;

  var row={};
  ps.forEach(function(p){
    row[p.key]={ p:p, P:0,W:0,D:0,L:0,PF:0,PA:0,Pts:0, form:[], seq:[] };
  });

  var rounds=fixtures.map(function(pairs,r){
    var di=slice[r];
    var games=pairs.map(function(pr){
      var A=ps[pr[0]], B=ps[pr[1]];
      var sa=di==null?null:A.scores[di], sb=di==null?null:B.scores[di];
      var g={a:A,b:B,sa:sa,sb:sb,state:"upcoming",margin:null,res:null,round:r+1,forfeit:null};
      if(di==null) return g;
      if(sa==null||sb==null){
        /* today's results may still be coming in */
        if(di===model.latest){ g.state="pending"; return g; }
        if(sa==null&&sb==null){ g.state="void"; return g; }
        if((era.missed||MISSED_FIXTURE)!=="walkover"){ g.state="void"; return g; }
        g.state="walkover"; g.res=(sa==null)?"b":"a"; g.forfeit=(sa==null)?"a":"b";
      } else {
        g.state="played";
        g.margin=Math.abs(sa-sb);
        g.res = g.margin<=margin ? "d" : (sa>sb?"a":"b");
        /* a score entered exactly one forfeit-gap below the opponent's */
        if(g.res!=="d" && (g.margin===FORFEIT_GAP || g.margin===margin+1))
          g.forfeit = sa<sb ? "a" : "b";
      }
      var ra=row[A.key], rb=row[B.key];
      ra.P++; rb.P++;
      if(sa!=null){ ra.PF+=sa; rb.PA+=sa; }
      if(sb!=null){ rb.PF+=sb; ra.PA+=sb; }
      if(g.res==="d"){
        ra.D++; rb.D++; ra.Pts+=DRAW_PTS; rb.Pts+=DRAW_PTS;
        ra.form.push("D"); rb.form.push("D");
      } else if(g.res==="a"){
        ra.W++; rb.L++; ra.Pts+=WIN_PTS; rb.Pts+=LOSS_PTS;
        ra.form.push("W"); rb.form.push("L");
      } else {
        rb.W++; ra.L++; rb.Pts+=WIN_PTS; ra.Pts+=LOSS_PTS;
        rb.form.push("W"); ra.form.push("L");
      }
      return g;
    });
    return { round:r+1, dateIdx:di, date:di==null?null:model.dates[di], games:games };
  });

  var cmp=function(a,b){
    return (b.Pts-a.Pts) || ((b.PF-b.PA)-(a.PF-a.PA)) || (b.PF-a.PF) ||
           a.p.name.localeCompare(b.p.name);
  };
  var table=ps.map(function(p){ return row[p.key]; }).sort(cmp);
  var played=rounds.filter(function(r){ return r.dateIdx!=null; }).length;
  return { rounds:rounds, table:table, per:plan.per, played:played, season:season,
           seasonNo:plan.season, margin:margin, era:era, roster:ps,
           complete:(played===plan.per), cmp:cmp };
}

/* Every hand-entered forfeit score, as {key, dateIdx}. */
function forfeitCells(model){
  var out=[];
  allSeasons(model).forEach(function(L){
    L.rounds.forEach(function(rd){ rd.games.forEach(function(g){
      if(g.state==="played"&&g.forfeit)
        out.push({ key:(g.forfeit==="a"?g.a:g.b).key, dateIdx:rd.dateIdx });
    }); });
  });
  return out;
}
/* The parse with those forfeit scores blanked out. */
function withoutForfeits(parsed,cells){
  var daily={};
  Object.keys(parsed.daily).forEach(function(k){ daily[k]=parsed.daily[k].slice(); });
  cells.forEach(function(c){ if(daily[c.key]) daily[c.key][c.dateIdx]=null; });
  var out={}; Object.keys(parsed).forEach(function(k){ out[k]=parsed[k]; });
  out.daily=daily;
  return out;
}

/* League position after each played round (for the position chart). */
function positionsByRound(L){
  var run={}, out={};
  L.roster.forEach(function(p){
    run[p.key]={p:p,Pts:0,PF:0,PA:0}; out[p.key]=[];
  });
  L.rounds.forEach(function(rd){
    if(rd.dateIdx==null) return;
    rd.games.forEach(function(g){
      if(g.state==="upcoming"||g.state==="void"||g.state==="pending") return;
      var ra=run[g.a.key], rb=run[g.b.key];
      if(g.sa!=null){ ra.PF+=g.sa; rb.PA+=g.sa; }
      if(g.sb!=null){ rb.PF+=g.sb; ra.PA+=g.sb; }
      if(g.res==="d"){ ra.Pts+=DRAW_PTS; rb.Pts+=DRAW_PTS; }
      else if(g.res==="a"){ ra.Pts+=WIN_PTS; rb.Pts+=LOSS_PTS; }
      else { rb.Pts+=WIN_PTS; ra.Pts+=LOSS_PTS; }
    });
    var order=Object.keys(run).map(function(k){ return run[k]; }).sort(L.cmp);
    order.forEach(function(r,i){ out[r.p.key].push(i+1); });
  });
  return out;
}

/* Every league season, for all-time views (head-to-head, hall of fame). */
function allSeasons(model){
  var n=seasonCount(model), out=[];
  for(var s=0;s<n;s++) out.push(buildLeague(model,s));
  return out;
}

/* Run lengths in a W/D/L sequence. */
function longestRun(seq,ok){
  var best=0,cur=0;
  seq.forEach(function(x){ if(ok(x)){ cur++; if(cur>best) best=cur; } else cur=0; });
  return best;
}

/* ============================================================================
   17. LEAGUE PANELS
   ========================================================================== */
function tipLeague(L){
  return '<b>How the league works</b> \u2014 every matchday, three fixtures are played from a fixed '+
    'round-robin draw, so everyone meets everyone twice across <b>'+L.per+' rounds</b>. A fixture '+
    'compares the two players\u2019 scores that day: more than <code>'+fmtInt(L.margin)+'</code> apart '+
    'is a win, within <code>'+fmtInt(L.margin)+'</code> is a draw. '+WIN_PTS+' points for a win, '+
    DRAW_PTS+' for a draw. Nothing extra is needed in the spreadsheet.';
}
var TIP_PFPA='<b>PF / PA / PD</b> \u2014 points For and Against are the raw TimeGuessr scores from '+
  'your fixtures (the league\u2019s goals); PD is the difference. Ties on points are broken by PD, '+
  'then PF.';
var TIP_PPG='<b>PPG</b> \u2014 points per game. Postponed fixtures leave some players with games in '+
  'hand, so PPG is the fairest like-for-like comparison mid-season.';
var TIP_VOID='<b>Postponed fixtures</b> \u2014 if either player missed the day, the fixture is void '+
  'and neither takes points. To make a no-show a forfeit instead, set '+
  '<code>MISSED_FIXTURE = "walkover"</code> in the script.';
var TIP_H2H='<b>Head-to-head</b> \u2014 every league fixture ever played between each pair, read '+
  'across a row: that player\u2019s wins\u2013draws\u2013losses against the column player. Uses '+
  'each season\u2019s own draw threshold, and forfeits count as results. A dot means the two have never met.';
var TIP_POS='<b>League position by round</b> \u2014 where everyone sat in the table after each '+
  'round of the selected season, using the same tie-breaks as the table.';

function currentSeason(){
  var total=seasonCount(STATE.lmodel);
  if(STATE.season==null||STATE.season>=total||STATE.season<0) STATE.season=Math.max(0,total-1);
  return STATE.season;
}
function formBadges(form){
  return '<span class="form">'+form.slice(-5).map(function(f){
    return '<i class="f'+f+'">'+f+'</i>';
  }).join("")+'</span>';
}
function nameTag(p){
  return '<span class="pname" style="--pc:'+p.color+'">'+esc(p.name)+'</span>';
}
function noLeague(body){
  body.innerHTML='<div class="empty">A league needs at least two players.</div>';
}

/* ---------------- League table ---------------- */
function renderLeague(body){
  var m=STATE.lmodel; if(m.players.length<2) return noLeague(body);
  var L=buildLeague(m,currentSeason());
  var missing=L.roster.filter(function(p){ return p.missing; });

  var h='<div class="kicker">Season '+L.seasonNo+' \u00B7 '+
    (L.played?'Round '+L.played+' of '+L.per:'Kicks off next matchday')+
    ' '+helpIcon(tipLeague(L))+'</div>';
  if(missing.length)
    h+='<div class="note">'+missing.map(function(p){ return '<b>'+esc(p.name)+'</b>'; }).join(", ")+
      ' '+(missing.length>1?'have':'has')+' no scores in the sheet yet, so '+
      (missing.length>1?'their':'their')+' fixtures show as postponed until the first score lands.</div>';
  h+='<div class="tscroll"><table class="ltable"><thead><tr>'+
     '<th>#</th><th>Player</th><th>P '+helpIcon(TIP_VOID)+'</th><th>W</th><th>D</th><th>L</th>'+
     '<th class="mh">PF '+helpIcon(TIP_PFPA)+'</th><th class="mh">PA</th><th class="mh">PD</th>'+
     '<th class="mh">PPG '+helpIcon(TIP_PPG)+'</th>'+
     '<th>Pts</th><th>Form</th></tr></thead><tbody>';
  L.table.forEach(function(r,i){
    var pd=r.PF-r.PA;
    h+='<tr class="'+(i===0?"lead":"")+'"><td class="pos">'+(i+1)+'</td>'+
      '<td>'+nameTag(r.p)+'</td>'+
      '<td class="num">'+r.P+'</td><td class="num">'+r.W+'</td><td class="num">'+r.D+'</td>'+
      '<td class="num">'+r.L+'</td>'+
      '<td class="num mh">'+fmtInt(r.PF)+'</td><td class="num mh">'+fmtInt(r.PA)+'</td>'+
      '<td class="num mh '+(pd>0?"up":(pd<0?"down":""))+'">'+(pd>0?"+":"")+fmtInt(pd)+'</td>'+
      '<td class="num mh">'+(r.P?(r.Pts/r.P).toFixed(2):"\u2014")+'</td>'+
      '<td class="pts num">'+r.Pts+'</td>'+
      '<td>'+formBadges(r.form)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="rulestrip"><span>Win &gt; '+fmtInt(L.margin)+'</span><span>Draw \u2264 '+
     fmtInt(L.margin)+'</span><span>'+WIN_PTS+' \u00B7 '+DRAW_PTS+' \u00B7 '+LOSS_PTS+' pts</span>'+
     '<span>Missed day = '+((L.era.missed||MISSED_FIXTURE)==="walkover"?'forfeit':'postponed')+'</span>'+
     (L.seasonNo>1&&eraFor(L.seasonNo).drawMargin!==eraFor(L.seasonNo-1).drawMargin?
       '<span class="chg">Threshold changed this season</span>':'')+'</div>';
  body.innerHTML=h;
}

/* ---------------- Fixtures & results ---------------- */
function renderFixtures(body){
  var m=STATE.lmodel; if(m.players.length<2) return noLeague(body);
  var L=buildLeague(m,currentSeason());
  var h='<div class="kicker">Season '+L.seasonNo+' \u00B7 '+L.per+' rounds</div><div class="rounds">';
  L.rounds.forEach(function(rd){
    var latest=(rd.round===L.played);
    h+='<div class="round'+(rd.dateIdx==null?" future":"")+(latest?" latest":"")+'">'+
       '<div class="rhead"><span class="rno">Round '+rd.round+'</span>'+
       (latest?'<span class="tag live">Latest</span>':'')+
       '<span class="rdate">'+(rd.date?esc(fmtDateLong(rd.date)):"To be played")+'</span></div>';
    rd.games.forEach(function(g){
      var aw=(g.res==="a"), bw=(g.res==="b"), dr=(g.res==="d");
      var mid = g.state==="upcoming" ? '<span class="vs">v</span>'
              : g.state==="pending" ? '<span class="vs wait">Awaiting</span>'
              : g.state==="void" ? '<span class="vs void">P\u2013P</span>'
              : g.forfeit ? '<span class="vs ff">Forfeit</span>'
              : dr ? '<span class="vs draw">Draw</span>'
              : '<span class="vs win">+'+fmtInt(g.margin==null?0:g.margin)+'</span>';
      var scA = g.forfeit==="a" ? '<span class="ffmark">FF</span>' : (g.sa==null?"\u2013":fmtInt(g.sa));
      var scB = g.forfeit==="b" ? '<span class="ffmark">FF</span>' : (g.sb==null?"\u2013":fmtInt(g.sb));
      h+='<div class="fix">'+
        '<span class="side a'+(aw?" w":"")+(bw?" l":"")+'"'+(aw?' style="color:'+g.a.color+'"':'')+'>'+
          esc(g.a.name)+'</span>'+
        '<span class="sc'+(aw?" w":"")+'">'+scA+'</span>'+mid+
        '<span class="sc'+(bw?" w":"")+'">'+scB+'</span>'+
        '<span class="side b'+(bw?" w":"")+(aw?" l":"")+'"'+(bw?' style="color:'+g.b.color+'"':'')+'>'+
          esc(g.b.name)+'</span></div>';
    });
    h+='</div>';
  });
  body.innerHTML=h+'</div>';
  /* bring the latest round into view inside the scrolling list */
  var box=body.querySelector(".rounds"), lat=body.querySelector(".round.latest");
  if(box&&lat) box.scrollTop=Math.max(0,lat.offsetTop-box.offsetTop-8);
}

/* ---------------- Position by round ---------------- */
function renderPositions(body){
  var m=STATE.lmodel; if(m.players.length<2) return noLeague(body);
  var L=buildLeague(m,currentSeason()), pos=positionsByRound(L), N=L.roster.length;
  if(!L.played){
    body.innerHTML='<div class="kicker">Season '+L.seasonNo+'</div>'+
      '<div class="empty">The chart starts after the first round of Season '+L.seasonNo+'.</div>';
    return;
  }
  var W=760, T=22, B=34, Lp=34, R=96, row=34, H=T+B+(N-1)*row;
  var X=function(r){ return Lp+(W-Lp-R)*(L.per<2?0:(r-1)/(L.per-1)); };
  var Y=function(p){ return T+(p-1)*row; };
  var s=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="League position after each round">'];
  for(var p=1;p<=N;p++){
    s.push('<line x1="'+Lp+'" x2="'+(W-R)+'" y1="'+Y(p)+'" y2="'+Y(p)+'" class="gridln"/>',
      '<text x="'+(Lp-12)+'" y="'+(Y(p)+4)+'" text-anchor="end" class="axl">'+p+'</text>');
  }
  for(var r=1;r<=L.per;r++)
    s.push('<text x="'+X(r).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" class="axl'+
      (r>L.played?' dim':'')+'">R'+r+'</text>');
  L.roster.forEach(function(pl){
    var seq=pos[pl.key]; if(!seq||!seq.length) return;
    var d=seq.map(function(v,i){ return (i?"L":"M")+X(i+1).toFixed(1)+" "+Y(v); }).join("");
    s.push('<path d="'+d+'" fill="none" stroke="'+pl.color+'" stroke-width="3" '+
      'stroke-linejoin="round" stroke-linecap="round"/>');
    seq.forEach(function(v,i){
      s.push('<circle cx="'+X(i+1).toFixed(1)+'" cy="'+Y(v)+'" r="4.2" fill="'+pl.color+'" '+
        'stroke="var(--panel)" stroke-width="2"/>');
    });
    var last=seq.length;
    s.push('<text x="'+(X(last)+12).toFixed(1)+'" y="'+(Y(seq[last-1])+4)+'" class="bumpname" '+
      'fill="'+pl.color+'">'+esc(pl.name)+'</text>');
  });
  s.push('</svg>');
  body.innerHTML='<div class="kicker">Season '+L.seasonNo+' \u00B7 after round '+L.played+' '+
    helpIcon(TIP_POS)+'</div><div class="chart-wrap bump">'+s.join("")+'</div>';
}

/* ---------------- Season records ---------------- */
function renderRecords(body){
  var m=STATE.lmodel; if(m.players.length<2) return noLeague(body);
  var L=buildLeague(m,currentSeason());
  var games=[];
  /* score-based records use genuine games only: a forfeit is a result, not a score */
  L.rounds.forEach(function(rd){ rd.games.forEach(function(g){
    if(g.state==="played"&&!g.forfeit) games.push(g);
  }); });
  var forfeits=0;
  L.rounds.forEach(function(rd){ rd.games.forEach(function(g){ if(g.forfeit) forfeits++; }); });
  if(!games.length){
    body.innerHTML='<div class="kicker">Season '+L.seasonNo+'</div>'+
      '<div class="empty">Records appear once Season '+L.seasonNo+' has a result.</div>';
    return;
  }
  var wins=games.filter(function(g){ return g.res!=="d"; });
  var draws=games.filter(function(g){ return g.res==="d"; });
  var winner=function(g){ return g.res==="a"?g.a:g.b; };
  var loser =function(g){ return g.res==="a"?g.b:g.a; };
  var big=wins.slice().sort(function(a,b){ return b.margin-a.margin; })[0];
  var close=wins.slice().sort(function(a,b){ return a.margin-b.margin; })[0];
  var top=null;
  games.forEach(function(g){
    [[g.a,g.sa],[g.b,g.sb]].forEach(function(x){ if(!top||x[1]>top.v) top={p:x[0],v:x[1],r:g.round}; });
  });
  /* runs, per player, across the season's fixtures in order */
  var seqs={};
  L.roster.forEach(function(p){ seqs[p.key]=[]; });
  L.rounds.forEach(function(rd){
    rd.games.forEach(function(g){
      if(g.state!=="played"&&g.state!=="walkover") return;
      seqs[g.a.key].push(g.res==="d"?"D":(g.res==="a"?"W":"L"));
      seqs[g.b.key].push(g.res==="d"?"D":(g.res==="b"?"W":"L"));
    });
  });
  var best=function(ok){
    var b={n:0,ps:[]};
    L.roster.forEach(function(p){
      var n=longestRun(seqs[p.key],ok);
      if(n>b.n) b={n:n,ps:[p]}; else if(n===b.n&&n>0) b.ps.push(p);
    });
    return b;
  };
  var unb=best(function(x){ return x!=="L"; }), wr=best(function(x){ return x==="W"; });
  var names=function(ps){ return ps.map(nameTag).join(" "); };

  var card=function(label,value,detail){
    return '<div class="rec"><div class="rlabel">'+label+'</div><div class="rval">'+value+'</div>'+
      '<div class="rdet">'+detail+'</div></div>';
  };
  var h='<div class="kicker">Season '+L.seasonNo+' \u00B7 '+games.length+' fixtures played'+
    (forfeits?' \u00B7 '+forfeits+' forfeit'+(forfeits===1?'':'s'):'')+'</div><div class="recs">';
  h+= big ? card("Biggest win",'+'+fmtInt(big.margin),
          nameTag(winner(big))+' beat '+nameTag(loser(big))+' \u00B7 R'+big.round) : '';
  h+= close ? card("Closest win",'+'+fmtInt(close.margin),
          nameTag(winner(close))+' edged '+nameTag(loser(close))+' \u00B7 R'+close.round) : '';
  h+= card("Top fixture score",fmtInt(top.v),nameTag(top.p)+' \u00B7 R'+top.r);
  h+= card("Longest unbeaten",unb.n+' game'+(unb.n===1?"":"s"),names(unb.ps)||"\u2014");
  h+= card("Longest winning run",wr.n+' game'+(wr.n===1?"":"s"),names(wr.ps)||"\u2014");
  h+= card("Draw rate",Math.round(draws.length/games.length*100)+'%',
          draws.length+' of '+games.length+' within '+fmtInt(L.margin));
  h+='</div>';

  /* draws per player */
  var dmax=Math.max.apply(null,L.table.map(function(r){ return r.D; }))||1;
  h+='<div class="kicker" style="margin-top:14px">Draws by player</div><div class="dbars">';
  L.table.slice().sort(function(a,b){ return b.D-a.D; }).forEach(function(r){
    h+='<div class="dbar"><span class="dn">'+esc(r.p.name)+'</span>'+
      '<span class="dtrack"><i style="width:'+(r.D/dmax*100)+'%;background:'+r.p.color+'"></i></span>'+
      '<span class="dv num">'+r.D+'</span></div>';
  });
  body.innerHTML=h+'</div>';
}

/* ---------------- Head-to-head (all seasons) ---------------- */
function renderH2H(body){
  var m=STATE.lmodel; if(m.players.length<2) return noLeague(body);
  var seasons=allSeasons(m), ppl=[], idx={}, rec={};
  seasons.forEach(function(L){
    L.roster.forEach(function(p){ if(!(p.key in idx)){ idx[p.key]=ppl.length; ppl.push(p); } });
  });
  ppl.forEach(function(p){ rec[p.key]={}; ppl.forEach(function(q){ rec[p.key][q.key]={W:0,D:0,L:0}; }); });
  var total=0;
  seasons.forEach(function(L){
    L.rounds.forEach(function(rd){ rd.games.forEach(function(g){
      if(g.state!=="played"&&g.state!=="walkover") return;
      total++;
      var ab=rec[g.a.key][g.b.key], ba=rec[g.b.key][g.a.key];
      if(g.res==="d"){ ab.D++; ba.D++; }
      else if(g.res==="a"){ ab.W++; ba.L++; }
      else { ba.W++; ab.L++; }
    }); });
  });
  var h='<div class="kicker">All seasons \u00B7 '+total+' fixtures '+helpIcon(TIP_H2H)+'</div>'+
    '<div class="tscroll"><table class="h2h"><thead><tr><th></th>'+
    ppl.map(function(q){ return '<th><span class="vlab" style="color:'+q.color+'">'+esc(q.name)+'</span></th>'; }).join("")+
    '<th>Overall</th></tr></thead><tbody>';
  ppl.forEach(function(p){
    var o={W:0,D:0,L:0};
    h+='<tr><th>'+nameTag(p)+'</th>';
    ppl.forEach(function(q){
      if(p.key===q.key){ h+='<td class="self"></td>'; return; }
      var c=rec[p.key][q.key], n=c.W+c.D+c.L;
      o.W+=c.W; o.D+=c.D; o.L+=c.L;
      if(!n){ h+='<td class="never">\u00B7</td>'; return; }
      var cls=c.W>c.L?"hwin":(c.L>c.W?"hloss":"heven");
      h+='<td class="'+cls+'"><span class="wdl">'+c.W+'\u2013'+c.D+'\u2013'+c.L+'</span></td>';
    });
    h+='<td class="tot"><span class="wdl">'+o.W+'\u2013'+o.D+'\u2013'+o.L+'</span></td></tr>';
  });
  body.innerHTML=h+'</tbody></table></div>';
}

/* ---------------- Hall of fame (all seasons) ---------------- */
function renderHall(body){
  var m=STATE.lmodel; if(m.players.length<2) return noLeague(body);
  var seasons=allSeasons(m), titles={};
  var h='<div class="kicker">League champions</div><div class="hof">';
  seasons.slice().reverse().forEach(function(L){
    var first=L.table[0], second=L.table[1];
    var games=0, draws=0;
    L.rounds.forEach(function(rd){ rd.games.forEach(function(g){
      if(g.state==="played"&&!g.forfeit){ games++; if(g.res==="d") draws++; }
    }); });
    var status=L.complete?"":(L.played?'<span class="tag live">Live</span>':'<span class="tag">Up next</span>');
    if(L.complete) titles[first.p.key]=(titles[first.p.key]||{p:first.p,n:0}), titles[first.p.key].n++;
    var tieOnPts=second&&first.Pts===second.Pts;
    h+='<div class="hrow'+(L.complete?"":" open")+'">'+
      '<span class="hs">S'+L.seasonNo+'</span>'+
      '<span class="hw">'+(L.played?(L.complete?'<span class="star">\u2605</span>':'')+nameTag(first.p):'\u2014')+
        status+'</span>'+
      '<span class="hp">'+(L.played?first.Pts+' pts'+(tieOnPts&&L.complete?' <em>on PD</em>':''):'')+'</span>'+
      '<span class="hd">'+(games?Math.round(draws/games*100)+'% draws \u00B7 \u2264'+fmtInt(L.margin):
        '\u2264'+fmtInt(L.margin))+'</span></div>';
  });
  h+='</div>';
  var tally=Object.keys(titles).map(function(k){ return titles[k]; })
    .sort(function(a,b){ return b.n-a.n||a.p.name.localeCompare(b.p.name); });
  if(tally.length){
    h+='<div class="kicker" style="margin-top:14px">Titles</div><div class="titles">';
    tally.forEach(function(t){
      h+='<div class="tt">'+nameTag(t.p)+'<span class="stars">'+
        new Array(t.n+1).join('\u2605')+'</span><span class="tn num">'+t.n+'</span></div>';
    });
    h+='</div>';
  }
  body.innerHTML=h;
}

function csvField(v){
  var s=String(v==null?"":v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCleanCSV(){
  var m=STATE.model, out=[["Date"].concat(m.players.map(function(p){return p.name;})).concat(["Winner"])];
  m.dates.forEach(function(d,i){
    out.push([String(d.d).padStart(2,"0")+"/"+String(d.m).padStart(2,"0")+"/"+d.y]
      .concat(m.players.map(function(p){ return p.scores[i]==null?"":p.scores[i]; }))
      .concat([(m.winners[i]||[]).map(function(k){
        return m.players.filter(function(p){return p.key===k;})[0].name; }).join(" & ")]));
  });
  return out.map(function(r){ return r.map(csvField).join(","); }).join("\n");
}

/* Status reporting. The Data Input panel used to host this; with the dashboard
   running purely off the live feed, problems surface in a masthead banner so a
   silent fetch failure can never masquerade as fresh data. */
function showMsg(kind,title,detail){
  STATE.lastMsg={k:kind,t:title,d:detail};
  var bar=document.getElementById("alert");
  if(!bar) return;
  /* success is already conveyed by the header stamp; only problems get a banner */
  if(kind==="ok"){ bar.className="alertbar"; bar.innerHTML=""; return; }
  bar.className="alertbar show "+kind;
  bar.innerHTML='<span class="ico">'+(kind==="err"?"\u2715":"!")+'</span>'+
    '<span class="txt"><b>'+esc(title)+'</b>'+(detail||"")+'</span>'+
    '<button class="alert-x" id="alert-x" aria-label="Dismiss">\u2715</button>';
  var x=document.getElementById("alert-x");
  if(x) x.addEventListener("click",function(){ bar.className="alertbar"; bar.innerHTML=""; });
}

/* ============================================================================
   12b. LIVE DATA SOURCE
   ----------------------------------------------------------------------------
   Paste your Google Sheets "Publish to web" CSV link below and the dashboard
   will pull fresh scores every time someone opens it — no re-uploading.

   To get the link:  File > Share > Publish to web > pick the sheet tab >
   format "Comma-separated values (.csv)" > Publish.  It looks like:
   https://docs.google.com/spreadsheets/d/e/2PACX-.../pub?gid=0&single=true&output=csv

   Leave url as "" to use the built-in sample data instead. The field is also
   editable in the Squad panel, which is handy for testing.
   ========================================================================== */
var DATA_SOURCE = {
  url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSlw5b1SHxnChlA9RNwxcMVsTd3p9BnR47fnV6y-lS8IZWenLkLdwTj3668MRNh7jq476LduGsNtpjl/pub?gid=84511765&single=true&output=csv",              /* published CSV link, or "" for the bundled sample */
  refreshMinutes: 0     /* 0 = fetch once on load; e.g. 15 = re-poll quarter-hourly */
};

var SRC={ kind:"sample", at:null, error:null, url:"" };

function fetchCSV(url){
  return fetch(url,{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("the server replied "+r.status);
    return r.text();
  }).then(function(txt){
    if(/^\s*</.test(txt))
      throw new Error("that link returned a web page, not CSV \u2014 set the format to CSV when publishing");
    return txt;
  });
}

function loadFromSource(url,quiet){
  SRC.url=url;
  var rb=document.getElementById("btn-refresh");
  if(rb) rb.hidden=false;
  return fetchCSV(url).then(function(txt){
    var ok=loadCSV(txt,quiet,"sheet");
    if(ok){ SRC.kind="sheet"; SRC.at=new Date(); SRC.error=null; }
    return ok;
  }).catch(function(err){
    SRC.error=err.message||String(err);
    SRC.kind=STATE.model?SRC.kind:"sample";
    if(!STATE.model){ loadCSV(SEED,true,"sample"); }
    updateStamp();
    showMsg("warn","Could not reach the live sheet",
      "<div style='margin-top:4px'>"+esc(SRC.error)+"</div>"+
      "<div style='margin-top:6px;opacity:.8'>Showing "+
      (SRC.kind==="sheet"?"the last data that loaded":"the bundled sample data")+
      " instead. Check the link is published as CSV and still shared.</div>");
    return false;
  });
}

function startAutoRefresh(){
  if(STATE.timer){ clearInterval(STATE.timer); STATE.timer=null; }
  var mins=DATA_SOURCE.refreshMinutes;
  if(mins>0&&SRC.url) STATE.timer=setInterval(function(){ loadFromSource(SRC.url,true); },mins*60000);
}


function loadCSV(text,quiet,kind){
  var parsed, model, lmodel, ff=[];
  try{
    parsed=parseSheet(text);
    /* League model: the sheet exactly as entered, so league history never moves.
       Dashboard model: the same data with hand-entered forfeit scores removed. */
    lmodel=buildModel(parsed);
    if(lmodel.players.length>1) ff=forfeitCells(lmodel);
    model=ff.length ? buildModel(withoutForfeits(parsed,ff)) : lmodel;
  }catch(err){
    var hint=(err instanceof ParseError)?err.hint:"Check that the export still has its date header row and player rows.";
    showMsg("err",(err.message||"Could not read that data."),
      "<div style='margin-top:4px'>"+esc(hint)+"</div>"+
      "<div style='margin-top:6px;opacity:.75'>The dashboard is still showing the last data that loaded.</div>");
    return false;
  }
  STATE.model=model; STATE.lmodel=lmodel; STATE.forfeits=ff; STATE.rawCSV=text; STATE.hidden={};
  if(kind){ SRC.kind=kind; if(kind!=="sheet") SRC.error=null; }
  if(kind==="paste"||kind==="file") SRC.at=new Date();
  STATE.view=null;                     /* force the scoped view to rebuild */
  if(typeof syncPeriodBar==="function") syncPeriodBar(); else renderPeriodBar();
  renderBoard();
  updateStamp();

  var failed=lmodel.checks.filter(function(c){ return !c.ok; });
  if(ff.length&&!quiet&&window.console&&console.info)
    console.info("Champions League: read "+ff.length+" forfeit entries (opponent minus "+
      fmtInt(FORFEIT_GAP)+"); they count in the league but are excluded from dashboard stats.");
  if(!quiet){
    var range=fmtDateLong(model.dates[0])+" \u2013 "+fmtDateLong(model.dates[model.latest]);
    /* Cross-check mismatches mean the SHEET's own summary rows disagree with the
       recomputed figures - almost always because a formula range did not stretch
       to new day columns. Everything on screen is recomputed and correct, so this
       is a note for the sheet owner, not an alarm for everyone opening the page:
       it goes to the console, never the banner. */
    if(parsed.warnings&&parsed.warnings.length&&window.console&&console.info)
      console.info("Champions League: "+parsed.warnings.join(" | "));
    if(failed.length&&window.console&&console.info)
      console.info("Champions League: "+failed.length+" sheet cross-check(s) differ from the recomputed "+
        "values (dashboard figures are the correct ones): "+
        failed.map(function(c){ return c.label; }).join(", "));
    showMsg("ok","Loaded "+model.dates.length+" days","");
  }
  return true;
}

/* Rebuild the period-scoped view and redraw only the panels that depend on it. */
function rescope(){
  STATE.view=null;
  refreshAll(["road","table","history","rolling","podium"]);
}

function updateStamp(){
  var m=STATE.model, el=document.getElementById("stamp");
  if(!m){ el.innerHTML='<span class="livedot"></span>Awaiting data'; return; }
  var lead=m.players.slice().sort(function(a,b){ return b.total-a.total; });
  var gap=lead.length>1?lead[0].total-lead[1].total:0;
  var src = SRC.kind==="sheet" ? "live sheet"
          : SRC.kind==="paste" ? "pasted data"
          : SRC.kind==="file"  ? "uploaded file" : "sample data";
  var when = SRC.at ? SRC.at.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : null;
  el.innerHTML='<span class="livedot"></span>Latest results <b>'+esc(fmtDateLong(m.dates[m.latest]))+'</b>'+
    '<br>'+m.dates.length+' days \u00B7 <b>'+esc(lead[0].name)+'</b> leads by '+fmtInt(gap)+
    '<br><span style="opacity:.75">'+src+(when?" \u00B7 "+when:"")+'</span>';
}

var PANEL_ORDER=PANELS.map(function(p){return p.id;});
var byId=function(id){ return PANELS.filter(function(p){return p.id===id;})[0]; };

function renderBoard(){
  var board=document.getElementById("board");
  board.innerHTML="";
  var shown=PANEL_ORDER.filter(function(id){
    var def=byId(id); return def && def.tab===(STATE.tab||"dashboard");
  });
  shown.forEach(function(id,i){
    var def=byId(id); if(!def) return;
    var el=document.createElement("section");
    el.className="panel"; el.dataset.id=id;
    el.style.setProperty("--span",def.span);
    el.style.animationDelay=(i*55)+"ms";
    el.innerHTML='<div class="phead">'+
        '<span class="ptitle">'+esc(def.title)+'</span>'+
        (def.note?'<span class="pnote">'+esc(def.note)+'</span>':'')+
      '</div><div class="pbody"></div>';
    board.appendChild(el);
    try{ def.render($(".pbody",el)); }
    catch(e){ $(".pbody",el).innerHTML='<div class="empty">This panel could not draw with the current data.</div>'; }
  });
}

function refreshAll(ids){
  ids.forEach(function(id){
    var el=document.querySelector('.panel[data-id="'+id+'"]');
    if(!el) return;
    try{ byId(id).render($(".pbody",el)); }catch(e){}
  });
}

/* ============================================================================
   14b. VIEW TABS
   ========================================================================== */
var TABS=[{k:"dashboard",label:"Dashboard"},{k:"league",label:"League"}];

function renderTabs(){
  var bar=document.getElementById("tabbar");
  if(!bar) return;
  bar.innerHTML=TABS.map(function(t){
    return '<button class="tab'+((STATE.tab||"dashboard")===t.k?" on":"")+'" role="tab" '+
      'aria-selected="'+((STATE.tab||"dashboard")===t.k)+'" data-tab="'+t.k+'">'+esc(t.label)+'</button>';
  }).join("");
  Array.prototype.forEach.call(bar.querySelectorAll("[data-tab]"),function(b){
    b.addEventListener("click",function(){
      STATE.tab=b.getAttribute("data-tab");
      Store.set("cl-tab",STATE.tab);
      renderTabs(); syncPeriodBar(); renderBoard();
    });
  });
}
/* The top bar shows the Race (period) selector on the dashboard and the Season
   selector in the league, so there is exactly one selector on screen either way. */
function syncPeriodBar(){
  if((STATE.tab||"dashboard")==="league") renderSeasonBar();
  else renderPeriodBar();
}

function renderSeasonBar(){
  var bar=document.getElementById("periodbar");
  if(!bar||!STATE.model) return;
  var plan=seasonPlan(STATE.lmodel), cur=currentSeason(), chips="";
  plan.forEach(function(p,i){
    var tag = p.mds.length===p.per ? "" : (p.mds.length ? '<span class="livetag">LIVE</span>'
                                                       : '<span class="livetag next">NEXT</span>');
    chips+='<button class="pchip'+(cur===i?" on":"")+'" data-season="'+i+'">S'+p.season+tag+'</button>';
  });
  var L=buildLeague(STATE.lmodel,cur);
  bar.style.display="";
  bar.innerHTML='<span class="plabel">Season</span><div class="pchips">'+chips+'</div>'+
    '<span class="phint">'+L.per+' rounds \u00B7 one per matchday \u00B7 draw within '+
    fmtInt(L.margin)+'</span>';
  Array.prototype.forEach.call(bar.querySelectorAll("[data-season]"),function(btn){
    btn.addEventListener("click",function(){
      STATE.season=+btn.getAttribute("data-season");
      Store.set("cl-season",STATE.season);
      renderSeasonBar(); refreshAll(["league","fixtures","positions","records"]);
    });
  });
}

/* ============================================================================
   15. BOOT
   ========================================================================== */
var SEED=(document.getElementById("seed-csv").textContent||"").replace(/^\n/,"");

document.getElementById("btn-refresh").addEventListener("click",function(){
  if(!SRC.url) return;
  loadFromSource(SRC.url,false);
});

Promise.all([Store.get("cl-period"),Store.get("cl-src"),Store.get("cl-tab"),Store.get("cl-season")])
  .catch(function(){ return [null,null,null,null]; })
  .then(function(saved){
    var period=saved&&saved[0], url=saved&&saved[1];
    STATE.period=period||"all";
    STATE.tab=(saved&&saved[2])||"dashboard";
    STATE.season=(saved&&saved[3])!=null?saved[3]:null;
    renderTabs(); syncPeriodBar();
    var src=(url||DATA_SOURCE.url||"").trim();
    if(src){
      SRC.url=src;
      loadCSV(SEED,true,"sample");                 /* paint something immediately */
      document.getElementById("btn-refresh").hidden=false;
      return loadFromSource(src,false).then(startAutoRefresh);
    }
    loadCSV(SEED,false,"sample");
  });
</script>
